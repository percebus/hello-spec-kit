name: "[C]ontinuous [I]ntegration"

# Every same-repo branch with a pull request into main is published as an R&D
# subsite (https://percebus.github.io/hello-spec-kit/<slug>/) and tested; passing
# end-to-end tests is the merge gate. main lives at …/main/; when CI succeeds on
# main, preview-verify.md (workflow_run) reviews main/ against the merged stories.
# See specs/002-pr-preview-verification.
#
# Environments (Settings → Environments):
#   github-pages → deployment branches: no restriction

on:
  workflow_dispatch: # Allows you to run this workflow manually from the Actions tab
  pull_request:
  push:
    branches:
      - main

# A newer push to the same ref cancels the older run. Writes to the R&D site are
# serialized separately by deploy-pages' job-level "pages" group.
concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  BASE_URL: https://percebus.github.io
  PREVIEW_SCAN: true
  NEXT_PUBLIC_BASE_PATH: /hello-spec-kit

jobs:
  VARIABLES:
    name: VARIABLES
    runs-on: ubuntu-latest
    steps:
      - uses: percebus/github-actions-common/.github/actions/checkout@main
      - uses: percebus/github-actions-node/.github/actions/setup@main

      - name: resolve variables
        id: variables
        env:
          KIND: ${{ github.ref_name == 'main' && 'main' || 'branch' }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          echo "kind=$KIND" >> "$GITHUB_OUTPUT"
          slug=main
          if [ "$KIND" = "branch" ]; then
            if ! slug="$(node .github/pages/branch-slug.mjs "$BRANCH" 2> slug-error.txt)"; then
              message="$(tr '\r\n' ' ' < slug-error.txt)"
              echo "::warning::No subsite for this branch: $message"
              echo "slug_error=$message" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          NEXT_PUBLIC_BASE_PATH="${NEXT_PUBLIC_BASE_PATH%/}/$slug"
          printf 'slug=%s\nbase_url=%s\nbase_path=%s\nsite_url=%s%s\n' \
            "$slug" "$BASE_URL" "$NEXT_PUBLIC_BASE_PATH" "$BASE_URL" "$NEXT_PUBLIC_BASE_PATH" >> "$GITHUB_OUTPUT"

    outputs:
      kind: ${{ steps.variables.outputs.kind }}
      branch: ${{ github.head_ref || github.ref_name }}
      sha: ${{ github.event.pull_request.head.sha || github.sha }}
      pr: ${{ github.event.pull_request.number }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      slug: ${{ steps.variables.outputs.slug }}
      slug_error: ${{ steps.variables.outputs.slug_error }}
      base_url: ${{ steps.variables.outputs.base_url }}
      base_path: ${{ steps.variables.outputs.base_path }}
      site_url: ${{ steps.variables.outputs.site_url }}

  #
  # Isolated build and tests; publishes nothing.
  verify:
    name: Verify
    needs: VARIABLES
    runs-on: ubuntu-latest
    env:
      BASE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_BASE_PATH: /hello-spec-kit/main # XXX should be directly
      PLAYWRIGHT_WEB_SERVER: true

    # SRC: https://github.com/EnricoMi/publish-unit-test-result-action?tab=readme-ov-file#permissions
    # SRC: https://github.com/dorny/test-reporter?tab=readme-ov-file#recommended-setup-for-public-repositories
    permissions:
      contents: read
      actions: read
      checks: write
      pull-requests: write

    steps:
      - uses: percebus/github-actions-common/.github/actions/checkout@main
      - uses: percebus/github-actions-node/.github/actions/setup@main

      # FIXME package-lock.json issues w/ microsoft packagefeed
      # - uses: percebus/github-actions-npm/.github/actions/install@main

      - name: npm install
        run: npm install

      # TODO
      # - name: npm run test:unit
      #   run: npm run test:unit

      - name: next build
        run: npm run build

      - name: npm run test:all
        run: npm run test:all

      - uses: percebus/github-actions-testing/.github/actions/junit@main
        with:
          files_pattern: test-results/junit.xml

          # XXX?
          list-tests: all

  # Builds the subsite (or main) with its base path and publishes it into the
  # R&D site. Deleting subsites of closed pull requests is handled by
  # pull_request_closed.yml. Fork pull requests are never published.
  deploy-pages:
    name: Deploy pages
    needs:
      - VARIABLES
      - verify
    if: ${{ github.ref_name == 'main' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    environment:
      # Link to the subsite this run published, not the site root.
      url: ${{ steps.site.outputs.page_url }}${{ steps.site.outputs.slug }}/
      name: github-pages

    # Shared with pull_request_closed.yml › delete-subsite: both read-modify-write
    # the gh-pages tree and redeploy the whole site, so they must not overlap.
    # `queue: max` keeps every waiting deployment instead of only the newest.
    concurrency:
      group: pages
      cancel-in-progress: false
      queue: max

    permissions: # Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
      contents: write
      pages: write
      id-token: write
      pull-requests: write

    outputs:
      slug: ${{ steps.subsite.outputs.slug }}

    env:
      NEXT_PUBLIC_BASE_PATH: ${{ needs.VARIABLES.outputs.base_path }}
      NEXT_PUBLIC_PREVIEW_PR: ${{ needs.VARIABLES.outputs.kind == 'branch' && needs.VARIABLES.outputs.pr || '' }}
      NEXT_PUBLIC_PREVIEW_REF: ${{ needs.VARIABLES.outputs.kind == 'branch' && needs.VARIABLES.outputs.branch || '' }}
      NEXT_PUBLIC_PREVIEW_SHA: ${{ needs.VARIABLES.outputs.kind == 'branch' && needs.VARIABLES.outputs.sha || '' }}

    steps:
      - uses: percebus/github-actions-common/.github/actions/checkout@main
      - uses: percebus/github-actions-node/.github/actions/setup@main

      - name: subsite slug
        id: subsite
        env:
          SLUG_ERROR: ${{ needs.VARIABLES.outputs.slug_error }}
        run: |
          if [ -n "$SLUG_ERROR" ]; then
            echo "::error::No subsite for this branch: $SLUG_ERROR; rename the branch"
            exit 1
          fi
          echo "slug=${{ needs.VARIABLES.outputs.slug }}" >> "$GITHUB_OUTPUT"

      - name: npm install
        run: npm install

      - name: next build
        run: npm run next:build

      - name: site.zip
        uses: percebus/github-actions-common/.github/actions/artifact-upload@main
        with:
          name: site
          path: ./out
          retention-days: 14

      - name: publish subsite
        id: site
        uses: ./.github/actions/replace-pages-artifact
        with:
          op: publish
          slug: ${{ steps.subsite.outputs.slug }}
          kind: ${{ needs.VARIABLES.outputs.kind }}
          branch: ${{ needs.VARIABLES.outputs.branch }}
          pr: ${{ needs.VARIABLES.outputs.pr }}
          sha: ${{ needs.VARIABLES.outputs.sha }}
          source: ${{ github.workspace }}/out
          run-url: ${{ needs.VARIABLES.outputs.run_url }}

      - name: wait for subsite
        run: |
          set -euo pipefail
          url="${{ needs.VARIABLES.outputs.site_url }}/preview.json"
          for _ in $(seq 1 30); do
            if [ "$(curl -fsS "$url?t=$(date +%s%N)" 2> /dev/null | jq -r '.sha // empty')" = "${{ needs.VARIABLES.outputs.sha }}" ]; then
              echo "${{ needs.VARIABLES.outputs.site_url }}/ shows ${{ needs.VARIABLES.outputs.sha }}"
              exit 0
            fi
            sleep 10
          done
          echo "::error::${{ needs.VARIABLES.outputs.site_url }}/ did not show ${{ needs.VARIABLES.outputs.sha }} within 5 minutes"
          exit 1

  e2e-tests-headless:
    name: E2E tests (headless Chromium)
    needs:
      - VARIABLES
      - deploy-pages
    if: ${{ needs.deploy-pages.result == 'success' && needs.deploy-pages.outputs.slug != '' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read
      checks: write
      pull-requests: write

    env:
      BASE_URL: ${{ needs.VARIABLES.outputs.base_url }}
      NEXT_PUBLIC_BASE_PATH: ${{ needs.VARIABLES.outputs.base_path }}
      PLAYWRIGHT_WEB_SERVER: ""
      PLAYWRIGHT_BROWSER: chromium

    steps:
      - uses: percebus/github-actions-common/.github/actions/checkout@main

      - uses: percebus/github-actions-node/.github/actions/setup@main

      - name: npm install
        run: npm install

      - name: playwright test
        run: npm run test:e2e

      - uses: percebus/github-actions-testing/.github/actions/junit@main
        if: ${{ !cancelled() }}
        with:
          files_pattern: test-results/junit.xml
          list-tests: all
          publish-test-deltas: true

  # The browser matrix runs only on main; headless Chromium runs on every
  # eligible ref and is the E2E merge gate (see copilot-notes.md › Merge gate).
  # SC-009: https://github.com/percebus/hello-spec-kit/issues/149
  e2e-tests-browsers:
    name: E2E tests @ ${{ matrix.browser }}@${{ matrix.os }}
    needs:
      - VARIABLES
      - deploy-pages
    if: ${{ github.ref_name == 'main' && needs.deploy-pages.result == 'success' && needs.deploy-pages.outputs.slug != '' }}

    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - browser: chrome
            install: chrome
            os: ubuntu-latest

          - browser: firefox
            install: firefox
            os: ubuntu-latest

          - browser: edge
            install: msedge
            os: windows-latest

          - browser: safari
            install: webkit
            os: macos-latest

    defaults:
      run:
        shell: bash

    permissions:
      contents: read
      actions: read
      checks: write
      pull-requests: write

    env:
      BASE_URL: ${{ needs.VARIABLES.outputs.base_url }}
      NEXT_PUBLIC_BASE_PATH: ${{ needs.VARIABLES.outputs.base_path }}
      PLAYWRIGHT_WEB_SERVER: ""
      PLAYWRIGHT_BROWSER: ${{ matrix.browser }}
      # Stop Git Bash on Windows from rewriting "/..." paths (e.g. the base path) into "C:/Program Files/Git/...".
      MSYS_NO_PATHCONV: "1"
      MSYS2_ARG_CONV_EXCL: "*"
      MSYS2_ENV_CONV_EXCL: "*"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: percebus/github-actions-common/.github/actions/checkout@main

      - uses: percebus/github-actions-node/.github/actions/setup@main

      # --ignore-scripts skips postinstall, which would install chromium.
      - name: npm install
        run: npm install --ignore-scripts

      - name: playwright install ${{ matrix.install }}
        run: npx playwright install --with-deps ${{ matrix.install }}

      - name: Start PulseAudio for Firefox
        if: ${{ matrix.browser == 'firefox' }}
        run: |
          sudo apt-get install -y --no-install-recommends pulseaudio
          pulseaudio --start --exit-idle-time=-1

      # macOS runners have no audio output device, so WebKit never gets past readyState 1.
      - name: Install virtual audio device for Safari
        if: ${{ matrix.browser == 'safari' }}
        run: |
          brew install --cask blackhole-2ch
          sudo killall coreaudiod || true

      - name: Enable Full Keyboard Access for Safari
        if: ${{ matrix.browser == 'safari' }}
        run: defaults write -g AppleKeyboardUIMode -int 3

      - name: playwright test
        run: npm run test:e2e

      - uses: percebus/github-actions-testing/.github/actions/junit@main
        if: ${{ !cancelled() }}
        with:
          files_pattern: test-results/junit.xml
          list-tests: all
          publish-test-deltas: ${{ runner.os == 'Linux' }}
