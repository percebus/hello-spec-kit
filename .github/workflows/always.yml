name: "[C]ontinuous [I]ntegration"

on:
  workflow_dispatch: # Allows you to run this workflow manually from the Actions tab
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  ENV: "development"

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    # SRC: https://github.com/EnricoMi/publish-unit-test-result-action?tab=readme-ov-file#permissions
    # SRC: https://github.com/dorny/test-reporter?tab=readme-ov-file#recommended-setup-for-public-repositories
    permissions:
      contents: read
      actions: read
      checks: write
      pull-requests: write
      statuses: write

    steps:
      - uses: percebus/github-actions-common/.github/actions/checkout@main
      - uses: percebus/github-actions-node/.github/actions/setup@main

      # FIXME package-lock.json issues w/ microsoft packagefeed
      # - uses: percebus/github-actions-npm/.github/actions/install@main

      - name: npm install
        run: npm install

      - name: next build
        run: npm run build

      - name: npm test
        run: npm test

      - uses: percebus/github-actions-testing/.github/actions/junit@main
        with:
          files_pattern: test-results/junit.xml

          # XXX?
          list-tests: all

      # R&D site subsite build. See specs/002-pr-preview-verification.
      - name: subsite slug
        id: subsite
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_name == 'main') }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if ! slug="$(node scripts/branch-slug.mjs "$HEAD_REF" 2>slug-error.txt)"; then
              echo "::warning::No subsite for this branch: $(cat slug-error.txt)"
              echo "error=$(cat slug-error.txt)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            slug="main"
          fi
          echo "slug=$slug" >> "$GITHUB_OUTPUT"

      - name: preview-verification pending
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
          SLUG_ERROR: ${{ steps.subsite.outputs.error }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$SLUG_ERROR" ]; then
            state="error"
            description="$(printf '%s; rename the branch' "$SLUG_ERROR" | cut -c1-140)"
          else
            state="pending"
            description="Waiting for subsite"
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state="$state" \
            -f context=preview-verification \
            -f description="$description" \
            -f target_url="$RUN_URL"

      - name: next build (subsite)
        if: ${{ steps.subsite.outputs.slug != '' }}
        env:
          NEXT_PUBLIC_BASE_PATH: /hello-spec-kit/${{ steps.subsite.outputs.slug }}
          NEXT_PUBLIC_PREVIEW_PR: ${{ github.event.pull_request.number }}
          NEXT_PUBLIC_PREVIEW_REF: ${{ github.head_ref }}
          NEXT_PUBLIC_PREVIEW_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          rm -rf out
          npm run next:build

      - name: site.zip
        if: ${{ steps.subsite.outputs.slug != '' }}
        uses: percebus/github-actions-common/.github/actions/artifact-upload@main
        with:
          name: site
          path: ./out
          retention-days: "14"
