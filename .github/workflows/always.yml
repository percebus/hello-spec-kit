name: "[C]ontinuous [I]ntegration"

# Every same-repo branch with a pull request into main is published as an R&D
# subsite (https://percebus.github.io/hello-spec-kit/<slug>/) and tested; passing
# end-to-end tests is the merge gate. main lives at …/main/; when CI succeeds on
# main, preview-verify.md (workflow_run) reviews main/ against the merged stories.
# See specs/002-pr-preview-verification.
#
# Environments (Settings → Environments):
#   github-pages → deployment branches: no restriction

on:
  workflow_dispatch: # Allows you to run this workflow manually from the Actions tab
  pull_request:
  push:
    branches:
      - main

# A newer push to the same ref cancels the older run. Writes to the R&D site are
# serialized separately by deploy-pages' job-level "pages" group.
concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  KIND: ${{ github.ref_name == 'main' && 'main' || 'branch' }}
  STATUS_CONTEXT: preview-verification
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  # Isolated build and tests; publishes nothing.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    env:
      BASE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_BASE_PATH: /hello-spec-kit/main
      PLAYWRIGHT_WEB_SERVER: true

    # SRC: https://github.com/EnricoMi/publish-unit-test-result-action?tab=readme-ov-file#permissions
    # SRC: https://github.com/dorny/test-reporter?tab=readme-ov-file#recommended-setup-for-public-repositories
    permissions:
      contents: read
      actions: read
      checks: write
      pull-requests: write

    steps:
      - uses: percebus/github-actions-common/.github/actions/checkout@main
      - uses: percebus/github-actions-node/.github/actions/setup@main

      # FIXME package-lock.json issues w/ microsoft packagefeed
      # - uses: percebus/github-actions-npm/.github/actions/install@main

      - name: npm install
        run: npm install

      # TODO
      # - name: npm run test:unit
      #   run: npm run test:unit

      - name: next build
        run: npm run build

      - name: npm run test:all
        run: npm run test:all

      - uses: percebus/github-actions-testing/.github/actions/junit@main
        with:
          files_pattern: test-results/junit.xml

          # XXX?
          list-tests: all

  # Builds the subsite (or main) with its base path and publishes it into the
  # R&D site. Deleting subsites of closed pull requests is handled by
  # pull_request_closed.yml. Fork pull requests are never published.
  deploy-pages:
    name: Deploy pages
    needs: verify
    if: ${{ github.ref_name == 'main' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    environment:
      # Link to the subsite this run published, not the site root.
      url: ${{ steps.site.outputs.page_url }}${{ steps.site.outputs.slug }}/
      name: github-pages

    # Shared with pull_request_closed.yml › delete-subsite: both read-modify-write
    # the gh-pages tree and redeploy the whole site, so they must not overlap.
    # `queue: max` keeps every waiting deployment instead of only the newest.
    concurrency:
      group: pages
      cancel-in-progress: false
      queue: max

    permissions: # Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
      contents: write
      pages: write
      id-token: write
      pull-requests: write
      statuses: write

    outputs:
      slug: ${{ steps.subsite.outputs.slug }}

    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - uses: percebus/github-actions-common/.github/actions/checkout@main
      - uses: percebus/github-actions-node/.github/actions/setup@main

      - name: subsite slug
        id: subsite
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set_status() {
            gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
              -f state="$1" -f context="$STATUS_CONTEXT" \
              -f description="$(printf '%s' "$2" | cut -c1-140)" \
              -f target_url="$RUN_URL" > /dev/null
          }

          if [ "$KIND" = "main" ]; then
            echo "slug=main" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! slug="$(node .github/pages/branch-slug.mjs "$BRANCH" 2> slug-error.txt)"; then
            message="$(cat slug-error.txt)"
            echo "::warning::No subsite for this branch: $message"
            set_status error "$message; rename the branch"
            exit 0
          fi
          set_status pending "Building subsite…"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"

      - name: configure build environment
        if: ${{ steps.subsite.outputs.slug != '' }}
        env:
          SLUG: ${{ steps.subsite.outputs.slug }}
        run: |
          set -euo pipefail
          set -a
          source ".env.$KIND"
          set +a
          if [ "$KIND" = "branch" ]; then
            NEXT_PUBLIC_BASE_PATH="${NEXT_PUBLIC_BASE_PATH//$SLUG}"
          fi
          echo "NEXT_PUBLIC_BASE_PATH=$NEXT_PUBLIC_BASE_PATH" >> "$GITHUB_ENV"

      - name: npm install
        if: ${{ steps.subsite.outputs.slug != '' }}
        run: npm install

      - name: next build
        if: ${{ steps.subsite.outputs.slug != '' }}
        env:
          NEXT_PUBLIC_PREVIEW_PR: ${{ github.event.pull_request.number }}
          NEXT_PUBLIC_PREVIEW_REF: ${{ github.head_ref }}
          NEXT_PUBLIC_PREVIEW_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          rm -rf out
          npm run next:build

      - name: site.zip
        if: ${{ steps.subsite.outputs.slug != '' }}
        uses: percebus/github-actions-common/.github/actions/artifact-upload@main
        with:
          name: site
          path: ./out
          retention-days: 14

      - name: publish subsite
        id: site
        if: ${{ steps.subsite.outputs.slug != '' }}
        uses: ./.github/actions/replace-pages-artifact
        with:
          op: publish
          slug: ${{ steps.subsite.outputs.slug }}
          kind: ${{ env.KIND }}
          branch: ${{ github.head_ref || github.ref_name }}
          pr: ${{ github.event.pull_request.number }}
          sha: ${{ github.event.pull_request.head.sha || github.sha }}
          source: ${{ github.workspace }}/out
          run-url: ${{ env.RUN_URL }}

      # Covers build and publish failures; keeps a clearer error already set
      # (for example an address collision).
      - name: preview-verification error
        if: ${{ failure() && env.KIND == 'branch' }}
        run: |
          current="$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/statuses" \
            --jq "[.[] | select(.context == \"$STATUS_CONTEXT\")][0].state // empty")"
          if [ "$current" != "error" ]; then
            gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
              -f state=error -f context="$STATUS_CONTEXT" \
              -f description="Inconclusive: building or publishing the subsite failed" \
              -f target_url="$RUN_URL" > /dev/null
          fi

  # The existing end-to-end tests, run against the deployed subsite (main included).
  e2e-tests:
    name: E2E tests
    needs: deploy-pages
    if: ${{ needs.deploy-pages.result == 'success' && needs.deploy-pages.outputs.slug != '' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read
      checks: write
      pull-requests: write
      statuses: write

    env:
      GH_TOKEN: ${{ github.token }}
      SLUG: ${{ needs.deploy-pages.outputs.slug }}
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_URL: https://percebus.github.io

    steps:
      - uses: percebus/github-actions-common/.github/actions/checkout@main
      - uses: percebus/github-actions-node/.github/actions/setup@main

      - name: npm install
        run: npm install

      - name: configure test environment
        run: |
          set -euo pipefail
          env_file=".env.$KIND"
          if [ "$KIND" = "branch" ]; then
            resolved_file="$RUNNER_TEMP/.env.branch"
            sed "s|{branch}|$SLUG|g" "$env_file" > "$resolved_file"
            cp "$resolved_file" "$env_file"
          fi
          set -a
          source "$env_file"
          set +a
          printf 'ENV=%s\nSITE_URL=%s%s\n' "$KIND" "$BASE_URL" "$NEXT_PUBLIC_BASE_PATH" >> "$GITHUB_ENV"
          if [ "$KIND" = "branch" ]; then
            gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
              -f state=pending -f context="$STATUS_CONTEXT" \
              -f description="Running end-to-end tests…" -f target_url="$RUN_URL" > /dev/null
          fi

      - name: wait for subsite
        run: |
          set -euo pipefail
          url="$SITE_URL/preview.json"
          for _ in $(seq 1 30); do
            if [ "$(curl -fsS "$url?t=$(date +%s%N)" 2> /dev/null | jq -r '.sha // empty')" = "$SHA" ]; then
              echo "$SITE_URL/ shows $SHA"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$SITE_URL/ did not show $SHA within 5 minutes"
          exit 1

      - name: playwright test
        run: npm run test:e2e

      - uses: percebus/github-actions-testing/.github/actions/junit@main
        if: ${{ !cancelled() }}
        with:
          files_pattern: test-results/junit.xml
          list-tests: all

      # Pre-merge gate: a branch subsite that passes its end-to-end tests may merge.
      - name: preview-verification result
        if: ${{ !cancelled() && env.KIND == 'branch' }}
        env:
          OUTCOME: ${{ job.status }}
        run: |
          if [ "$OUTCOME" = "success" ]; then
            state=success description="Subsite passed end-to-end tests"
          else
            state=failure description="End-to-end tests failed on the subsite"
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state="$state" -f context="$STATUS_CONTEXT" \
            -f description="$description" -f target_url="$RUN_URL" > /dev/null
