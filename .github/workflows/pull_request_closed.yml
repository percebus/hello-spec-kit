name: Pull request closed

# Deletes a closed (or merged) pull request's R&D subsite
# (https://percebus.github.io/hello-spec-kit/<slug>/).
# See specs/002-pr-preview-verification.
#
# pull_request_target runs this file from the default branch with
# GITHUB_REF=refs/heads/main, so it can deploy to github-pages, and it runs even
# when the pull request has conflicts. It never checks out pull request code.

on:
  pull_request_target:
    types:
      - closed
    branches:
      - main

# Runs as soon as the pull request closes; it does not wait for CI. Only the
# job that rewrites the site is serialized, through the job-level "pages" group
# shared with always.yml › deploy-pages (see below).

permissions:
  contents: read

jobs:
  delete-subsite:
    name: Delete subsite
    # Fork pull requests never get a subsite.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    environment:
      url: ${{ steps.site.outputs.page_url }}
      name: github-pages

    # Same group as always.yml › deploy-pages: both read-modify-write the
    # gh-pages tree and redeploy the whole site, so they must not overlap.
    concurrency:
      group: pages
      cancel-in-progress: false
      queue: max

    permissions:
      contents: write
      pages: write
      id-token: write
      pull-requests: write

    steps:
      - uses: percebus/github-actions-common/.github/actions/checkout@main

      - name: delete subsite
        id: site
        uses: ./.github/actions/replace-pages-artifact
        with:
          op: delete
          branch: ${{ github.event.pull_request.head.ref }}
          pr: ${{ github.event.pull_request.number }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
