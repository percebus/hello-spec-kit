name: Audit closed issues

on:
  issues:
    types: [closed]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Closed issue to audit
        required: true
        type: number

concurrency:
  group: issue-closure-auditor-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: percebus/github-actions-common/.github/actions/checkout@main
      - uses: percebus/github-actions-node/.github/actions/setup@main

      - name: Install Copilot CLI
        run: npm install --global @github/copilot@1.0.93

      - name: Audit issue and its sub-issues
        env:
          GH_TOKEN: ${{ github.token }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          PROJECT_TOKEN: ${{ secrets.ISSUE_AUDITOR_PROJECT_TOKEN }}
          PROJECT_OWNER: ${{ vars.PODSITE_PROJECT_OWNER || github.repository_owner }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          AUDIT_ACTOR: ${{ github.actor }}
        run: node scripts/audit-closed-issue.mjs
